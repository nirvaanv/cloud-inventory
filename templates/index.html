<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Inventory</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #17202a; }
    h1 { margin-bottom: .25rem; }
    form { display: flex; flex-wrap: wrap; gap: .75rem; margin: 2rem 0; }
    input, button { font: inherit; padding: .65rem; }
    input[name="name"] { flex: 1; min-width: 12rem; }
    button { background: #155eef; border: 0; border-radius: .3rem; color: white; cursor: pointer; }
    li { padding: .7rem 0; border-bottom: 1px solid #ddd; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <h1>Cloud Inventory</h1>
  <p>A small Flask app with SQLite storage.</p>
  <form action="{{ url_for('add_product') }}" method="post">
    <input name="name" placeholder="Product name" required maxlength="120">
    <input name="quantity" type="number" min="0" placeholder="Quantity" required>
    <button type="submit">Add product</button>
  </form>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <h2>Products</h2>
  {% if products %}
    <ul>{% for product in products %}<li>{{ product.name }} — {{ product.quantity }} in stock</li>{% endfor %}</ul>
  {% else %}
    <p>No products yet. Add one above.</p>
  {% endif %}
</body>
</html>
